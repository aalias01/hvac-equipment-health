name: hvac-health
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pandas=2.3.3
  - numpy=2.0.2
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - plotly>=5.15.0
  - scikit-learn=1.7.2
  - scipy>=1.11.0
  - statsmodels>=0.14.0
  - joblib=1.5.3
  - jupyter
  - notebook
  - ipykernel
  - pip
  - pip:
      - shap==0.49.1
      - fastapi==0.128.8
      - uvicorn[standard]==0.39.0
      - pydantic==2.13.4
      - python-multipart==0.0.20
      - pytest==8.4.2
      - ruff==0.14.10
      - httpx==0.28.1
